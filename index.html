<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🐙 sweet monster quartet</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Header -->
  <header>
    <h1>🐙 sweet monster quartet</h1>
    <p>Choose your strongest ability and defeat the computer!</p>
  </header>

  <!-- Punktestand -->
  <div class="scoreboard">
    <div class="score-item">
      <span>your cards</span>
      <strong id="player-count">—</strong>
    </div>
    <div class="score-item">
      <span>computer</span>
      <strong id="computer-count">—</strong>
    </div>
  </div>

  <!-- Spielfeld -->
  <div class="arena">
    <div class="player-side">
      <div class="side-label">👤 you</div>
      <div id="player-card"></div>
    </div>
    <div class="computer-side">
      <div class="side-label">💻 computer</div>
      <div id="computer-card"></div>
    </div>
  </div>

  <!-- Ergebnis -->
  <div class="result-area">
    <div id="result-message" class="result-message">load game...</div>
    <br />
    <button id="next-btn" class="btn btn--primary" onclick="nextRound()">
      next round ➜
    </button>
  </div>

  <!-- End-Screen -->
  <div id="end-overlay">
    <div class="end-box">
      <h2 id="end-title"></h2>
      <p id="end-sub"></p>
      <button class="btn btn--primary" onclick="restartGame()">🔄 play again</button>
    </div>
  </div>

  <script src="game.js"></script>



  <div class="bubbles">
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
</div>
</body>
</html>
