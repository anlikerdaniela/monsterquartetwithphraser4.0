<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🐙 sweet monster quartet</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Header -->
<header>
  <div class="avatar-wrapper" onclick="toggleAvatarMenu()">
    <div class="avatar" id="current-avatar">🧚‍♀️</div>
    <div class="avatar-menu" id="avatar-menu">
      <p class="avatar-menu-title">Choose your avatar</p>
      <div class="avatar-options">
        <span onclick="selectAvatar('🧚')">🧚</span>
        <span onclick="selectAvatar('🧚‍♀️')">🧚‍♀️</span>
        <span onclick="selectAvatar('🧚‍♂️')">🧚‍♂️</span>
        <span onclick="selectAvatar('👩')">👩</span>
        <span onclick="selectAvatar('👨')">👨</span>
        <span onclick="selectAvatar('👧')">👧</span>
        <span onclick="selectAvatar('👦')">👦</span>
        <span onclick="selectAvatar('👩‍🦰')">👩‍🦰</span>
        <span onclick="selectAvatar('👩‍🦱')">👩‍🦱</span>
        <span onclick="selectAvatar('👩‍🦳')">👩‍🦳</span>
        <span onclick="selectAvatar('🧙‍♀️')">🧙‍♀️</span>
        <span onclick="selectAvatar('🦸‍♀️')">🦸‍♀️</span>
      </div>
    </div>
  </div>
  <h1>🐙 sweet monster quartet</h1>
  <div class="wavy-lines">
    <svg viewBox="0 0 3000 120" preserveAspectRatio="none">
      <path class="wave wave1" d="M0,60 C375,10 750,110 1125,60 C1500,10 1875,110 2250,60 C2625,10 2850,80 3000,60"/>
      <path class="wave wave2" d="M0,80 C400,20 800,120 1200,70 C1600,20 2000,100 2400,60 C2700,30 2900,90 3000,80"/>
    </svg>
  </div>
  <p>Choose your strongest ability and defeat the computer!</p>
  <div class="lives">
    <span class="life">🥚</span>
    <span class="life">🥚</span>
    <span class="life">🥚</span>
  </div>
</header>

  <!-- Punktestand -->
  <div class="scoreboard">
    <div class="score-item">
      <span>your cards</span>
      <strong id="player-count">—</strong>
    </div>
    <div class="score-item">
      <span>computer</span>
      <strong id="computer-count">—</strong>
    </div>
  </div>

  <!-- Spielfeld -->
  <div class="arena">
    <div class="player-side">
      <div class="side-label">👤 you</div>
      <div id="player-card"></div>
    </div>
    <div class="computer-side">
      <div class="side-label">💻 computer</div>
      <div id="computer-card"></div>
    </div>
  </div>

  <!-- Ergebnis -->
  <div class="result-area">
    <div id="result-message" class="result-message">load game...</div>
    <br />
    <button id="next-btn" class="btn btn--primary" onclick="nextRound()">
      next round ➜
    </button>
  </div>

  <!-- End-Screen -->
  <div id="end-overlay">
    <div class="end-box">
      <h2 id="end-title"></h2>
      <p id="end-sub"></p>
      <button class="btn btn--primary" onclick="restartGame()">🔄 play again</button>
    </div>
  </div>

  <script src="game.js"></script>



  <div class="bubbles">
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
</div>
</body>
</html>
